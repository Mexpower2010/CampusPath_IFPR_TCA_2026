<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusPath - Administracao</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>Campus<span>Path</span> <small>IFPR Cascavel</small></h1>
    <nav class="menu">
      <a href="index.html">Mapa e rotas</a>
      <a href="professor.html">Area do professor</a>
      <a href="admin.html" class="ativo">Administracao</a>
    </nav>
  </header>

  <main>
    <div id="aviso" class="mensagem"></div>

    <section id="painelLogin" class="painel estreito">
      <h2>Entrar como administrador</h2>
      <form id="formLogin" class="formulario">
        <div>
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div>
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Entrar</button>
      </form>
      <p class="rodape">Conta de teste: admin@campuspath.ifpr.edu.br / admin123</p>
    </section>

    <section id="painelSessao" class="painel oculto">
      <div class="linha entre">
        <div>
          <h2 style="margin:0">Administracao do campus</h2>
          <p class="detalhe" style="margin:4px 0 0">Sessao de <span id="nomeSessao">-</span>, valida ate <span id="expiraSessao">-</span>.</p>
        </div>
        <div class="linha">
          <button id="exportar" class="secundario">Exportar snapshot</button>
          <button id="sair" class="secundario">Sair</button>
        </div>
      </div>
    </section>

    <div id="painelAdmin" class="oculto">
      <nav id="abas" class="abas"></nav>

      <div class="grade">
        <section class="painel">
          <h2 id="tituloAba">Registros</h2>
          <div id="tabela" class="tabela-envolucro"></div>
        </section>

        <aside>
          <section class="painel">
            <h2 id="tituloForm">Novo registro</h2>
            <form id="formEntidade" class="formulario"></form>
            <div class="linha" style="margin-top:12px">
              <button type="button" id="cancelarEdicao" class="secundario oculto">Cancelar edicao</button>
            </div>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
